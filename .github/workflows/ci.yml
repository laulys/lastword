name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Dependencias
        run: uv sync --frozen
      - name: Lint y formato
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Tipos
        run: uv run --frozen mypy src tests eval
      - name: Tests (sin red ni modelos)
        run: uv run --frozen pytest
