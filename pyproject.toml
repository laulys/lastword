[project]
name = "vigente"
version = "0.1.0"
description = "Memoria para agentes de IA que sabe qué sigue siendo verdad."
readme = "README.md"
authors = [
    { name = "laulys20", email = "187386385+laulys@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.29.2",
]

[project.scripts]
vigente = "vigente.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
